<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">How playwright-cucumber-bdd works</title><desc id="desc">Gherkin features map to step definitions, which call page objects and assert outcomes. Page objects own browser interactions through Playwright against the Practice Software Testing Toolshop. Typed World and hooks create a fresh browser context, page and page objects per scenario, with one browser per worker. Cucumber produces HTML, JSON, JUnit XML and a failed-scenario rerun list. Failures attach a screenshot and URL; traces are retained on failure by default.</desc><rect x="0" y="0" width="1600" height="800" rx="24" fill="#0E131B" stroke="none" stroke-width="2"/><text x="64" y="91" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="#F8FAFC">From Gherkin to the browser</text><text x="64" y="140" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#B8C4D4">Cucumber maps readable steps to typed page-object calls and assertions.</text><rect x="64" y="207" width="300" height="229" rx="16" fill="#171E29" stroke="#344154" stroke-width="2"/><rect x="88" y="234" width="40" height="5" rx="2" fill="#F2B86A" stroke="none" stroke-width="2"/><text x="88" y="282" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">Gherkin features</text><text x="88" y="321" font-family="Courier New, monospace" font-size="20" font-weight="400" fill="#F2B86A">features/*.feature</text><text x="88" y="373" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B8C4D4">Readable scenarios</text><text x="88" y="404" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B8C4D4">Given / When / Then</text><rect x="416" y="207" width="330" height="229" rx="16" fill="#171E29" stroke="#344154" stroke-width="2"/><rect x="440" y="234" width="40" height="5" rx="2" fill="#F2B86A" stroke="none" stroke-width="2"/><text x="440" y="282" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">Step definitions</text><text x="440" y="321" font-family="Courier New, monospace" font-size="20" font-weight="400" fill="#F2B86A">src/steps/*.steps.ts</text><text x="440" y="373" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B8C4D4">Page-object calls</text><text x="440" y="404" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B8C4D4">Assertions with expect</text><rect x="798" y="207" width="330" height="229" rx="16" fill="#171E29" stroke="#344154" stroke-width="2"/><rect x="822" y="234" width="40" height="5" rx="2" fill="#F2B86A" stroke="none" stroke-width="2"/><text x="822" y="282" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">Page objects</text><text x="822" y="321" font-family="Courier New, monospace" font-size="20" font-weight="400" fill="#F2B86A">src/pages/*.page.ts</text><text x="822" y="373" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B8C4D4">Locators and actions</text><text x="822" y="404" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B8C4D4">No business assertions</text><rect x="1180" y="207" width="356" height="229" rx="16" fill="#171E29" stroke="#344154" stroke-width="2"/><rect x="1204" y="234" width="40" height="5" rx="2" fill="#F2B86A" stroke="none" stroke-width="2"/><text x="1204" y="282" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">Playwright</text><text x="1204" y="321" font-family="Courier New, monospace" font-size="20" font-weight="400" fill="#F2B86A">Browser automation</text><text x="1204" y="373" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B8C4D4">Practice Software</text><text x="1204" y="404" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B8C4D4">Testing Toolshop</text><path d="M371 315H404m-10 -7 10 7-10 7" fill="none" stroke="#B8C4D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M753 315H786m-10 -7 10 7-10 7" fill="none" stroke="#B8C4D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M1135 315H1168m-10 -7 10 7-10 7" fill="none" stroke="#B8C4D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M588 436V472M976 436V472M1358 436V472M588 472H1358" fill="none" stroke="#344154" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M976 472V494" fill="none" stroke="#344154" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><rect x="64" y="498" width="1472" height="111" rx="16" fill="#35291C" stroke="none" stroke-width="2"/><text x="88" y="540" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#F8FAFC">Typed World + hooks</text><text x="88" y="579" font-family="Courier New, monospace" font-size="20" font-weight="400" fill="#F2B86A">src/support/world.ts · hooks.ts</text><text x="600" y="540" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#F8FAFC">One browser per worker; fresh context, page and page objects per scenario.</text><text x="600" y="578" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B8C4D4">ToolshopWorld exposes page objects to steps through this.pages.</text><path d="M64 651H1536" fill="none" stroke="#344154" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="696" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#F8FAFC">Reports + failure diagnostics</text><text x="64" y="738" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#B8C4D4">Cucumber HTML / JSON / JUnit XML + rerun list</text><text x="852" y="696" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#F8FAFC">Failure screenshot + URL attached to the report</text><text x="852" y="738" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B8C4D4">Traces retained on failure with the default configuration</text></svg>